LC_MESSAGES="C.UTF-8"

COMMON_FLAGS="-O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
LDFLAGS="-Wl,-O2 -Wl,--sort-common -Wl,--as-needed -Wl,-z,pack-relative-relocs"

CGO_CFLAGS="${CFLAGS}"
CGO_CXXFLAGS="${CXXFLAGS}"
CGO_FFLAGS="${FFLAGS}"
CGO_LDFLAGS="${LDFLAGS}"

MAKEOPTS="-j4"
ACCEPT_LICENSE="*"

FEATURES="buildpkg"
PKGDIR="/var/cache/binpkgs"

# Applied only when emerging into ROOT=/mnt/dist
RELEASE_INSTALL_MASK="/usr/include /usr/share/doc /usr/share/man /usr/share/info /usr/share/gtk-doc /usr/share/pkgconfig /usr/lib/pkgconfig /usr/lib64/pkgconfig *.a *.la"
